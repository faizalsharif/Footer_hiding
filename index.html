<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Footer Hide on Scroll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Scroll Down to Hide Footer</h1>
  </header>

  <main>
    <p>Scroll to test footer hiding...</p>
    <!-- Add dummy content -->
    <div class="content">
      <p>Lorem ipsum dolor sit amet...</p>
      <p>Keep scrolling to test the footer...</p>
      <p style="margin-bottom: 1000px;">More content here</p>
    </div>
  </main>

  <footer id="footer">
    🚀 This footer hides on scroll down, and shows on scroll up.
  </footer>

  <script>
    // Detect if the page is being displayed inside the WebView
    const isInFlutterWebView = navigator.userAgent.includes('MyFlutterAppWebView');
    
    if (isInFlutterWebView) {
      const footer = document.querySelector('#footer');
      if (footer) {
        // Initially hide the footer in the WebView
        footer.style.display = 'none';
      }
    }

    // Hiding or showing footer based on scroll position (Works for WebView and regular browser)
    window.addEventListener('scroll', function() {
      const footer = document.querySelector('#footer');
      if (footer) {
        if (window.scrollY > 100) { // Hide when scrolled down
          footer.style.display = 'none';
        } else { // Show when scrolled up
          footer.style.display = 'block';
        }
      }
    });
  </script>
</body>
</html>
